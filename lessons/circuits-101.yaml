# The short demo: three steps, one spoken question, about a minute of hands-on time.
# The flow, the starting layout and the reasons are in docs/lab-flow.md. The full six-step
# lesson is circuits-101-full.yaml.
#
# Starting layout (laid out before the judge sits down): a loop of battery, one bulb and
# wires with the OPEN (cyan) switch already in it, and an empty side branch beside the bulb.
# The closed (green) switch and a second bulb within reach. Lab mode starts at 3 V.
#
# Every done_when condition must hold for half a second on a visible mat.
# Vibration represents current; the wheel controls voltage.

id: circuits-101
title: Feel the current
# How long a finished step without a question stays on screen before the next prompt.
linger_seconds: 2.5

steps:
  - id: close_the_loop
    prompt: "Close the circuit: swap in the green switch."
    done_when: { status: working, batteries: 1, bulbs: 1, lit_bulbs: 1, switch_closed: true }

  - id: raise_voltage
    prompt: "Touch the bulb to feel the pulse, then scroll up to 6 V."
    done_when: { status: working, batteries: 1, bulbs: 1, lit_bulbs: 1, touching: bulb, min_voltage: 6 }
    reflection:
      target_idea: "A higher voltage pushes more current through the bulb, and the pulse is the current."
      confirmation: "Exactly. More voltage pushes more current through the bulb, and that's what you feel."
      misconceptions:
        - tag: pulse_is_voltage
          description: "Thinks the pulse is the voltage itself, not the current it drives."
        - tag: brightness_only
          description: "Describes the bulb getting brighter with no mention of current."
      levels:
        - question: "Why did the pulse speed up when you turned up the voltage?"
          correct_examples:
            - "more voltage pushes more current through the bulb"
            - "the battery pushes harder so more flows and the pulse is the flow"
            - "higher voltage means more current and thats what i feel"
        - question: "Here's a hint: the pulse is the current. What does more voltage do to the current?"
          correct_examples:
            - "it makes it bigger"
            - "more voltage more current"
            - "it pushes more of it through"
        - question: "So does more voltage mean more current, or less?"
          correct_examples:
            - "more"
            - "more current"
            - "it pushes more"
      exit:
        line: "More voltage pushes more current, and the pulse is the current. Scroll down and feel it slow, then back up to 6."
        then:
          - { touching: bulb, max_voltage: 3 }
          - { touching: bulb, min_voltage: 6 }
        # Counted from when the line has been said.
        timeout_seconds: 12

  - id: parallel
    prompt: "Drop the second bulb into the gap, then touch the battery."
    done_when: { status: working, batteries: 1, bulbs: 2, arrangement: parallel, lit_bulbs: 2, touching: battery }
