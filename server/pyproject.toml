[project]
name = "tacto"
version = "0.1.0"
description = "Tacto server: reads the paper mat, solves the circuit, sends the lab state"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "opencv-python>=4.10",
    "networkx>=3.3",
    "pyyaml>=6",
    "pillow>=10",
    "httpx>=0.27",
    "websockets>=12",
    "python-dotenv>=1",
    "inspice>=1.6.3.3",
    "mediapipe>=1.2.3",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tacto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tacto_bench is tooling, not part of the installed package, so tests find it from here.
pythonpath = ["."]
