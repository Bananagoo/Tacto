<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tacto hand-set mat</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --fg:#1b1b1b; --line:#c9c9c4; --panel:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#17181a; --fg:#ececec; --line:#44474c; --panel:#222427; } }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui, sans-serif; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 12px; opacity:.8; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; align-items:center; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--fg); cursor:pointer; }
  button[aria-pressed=true] { outline:3px solid #2f7de1; }
  label { display:flex; gap:6px; align-items:center; }
  svg { width:100%; max-width:860px; background:var(--panel); border:1px solid var(--line); border-radius:8px; touch-action:none; }
  .seg { stroke:transparent; stroke-width:.5; cursor:pointer; }
  .seg:hover { stroke:rgba(47,125,225,.25); }
  .piece { stroke-width:.16; stroke-linecap:round; pointer-events:none; }
  .wire{stroke:#111} .battery{stroke:#d62828} .bulb{stroke:#f2b705} .resistor{stroke:#1d5fd1} .switch{stroke:#1f9d55}
  @media (prefers-color-scheme: dark) { .wire{stroke:#bbb} }
  .shorted { stroke-dasharray:.12 .2; }
  text { font-size:.15px; fill:var(--fg); pointer-events:none; text-anchor:middle; }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; max-width:840px; overflow:auto; }
  #status { font-weight:600; }
</style>
</head>
<body>
<h1>Hand-set mat</h1>
<p>Pick a tool, click between two dots. The same tool again toggles a switch, turns a battery round, or removes the piece. With the finger on, resting the pointer on a switch for half a second taps it.</p>
<div class="row" id="tools"></div>
<div class="row" id="presets"><span>Presets:</span></div>
<div class="row">
  <label><input type="checkbox" id="finger"> Finger follows the pointer</label>
  <label><input type="checkbox" id="visible" checked> Camera sees the mat</label>
  <label>Battery <input type="range" id="volts" min="0" max="9" step="0.5" value="6"> <span id="voltsText">6 V</span></label>
</div>
<svg id="mat"></svg>
<div class="row"><span id="status">connecting…</span></div>
<div class="row"><span id="lesson"></span> <button id="restart">Restart lesson</button></div>
<pre id="touch"></pre>
<script>
const TOOLS = ['wire', 'battery', 'bulb', 'resistor', 'switch', 'erase']
let tool = 'wire', grid = null, socket = null, lastFinger = 0
const svg = document.getElementById('mat'), NS = 'http://www.w3.org/2000/svg'
const post = (path, body) => fetch('/manual/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
const el = (name, attrs, parent) => { const n = document.createElementNS(NS, name); for (const k in attrs) n.setAttribute(k, attrs[k]); parent.appendChild(n); return n }

for (const name of TOOLS) {
  const b = document.createElement('button'); b.textContent = name; b.setAttribute('aria-pressed', name === tool)
  b.onclick = () => { tool = name; for (const o of document.querySelectorAll('#tools button')) o.setAttribute('aria-pressed', o === b) }
  document.getElementById('tools').appendChild(b)
}
fetch('/manual/presets').then(r => r.json()).then(names => { for (const name of names) {
  const b = document.createElement('button'); b.textContent = name.replace('_', ' '); b.onclick = () => post('preset', { name })
  document.getElementById('presets').appendChild(b) } })
document.getElementById('visible').onchange = e => post('mat_visible', { visible: e.target.checked })
document.getElementById('restart').onclick = () => post('restart_lesson', {})
document.getElementById('finger').onchange = e => { if (!e.target.checked) post('finger', { present: false }) }
document.getElementById('volts').oninput = e => { const volts = Number(e.target.value)
  document.getElementById('voltsText').textContent = volts + ' V'
  if (socket && socket.readyState === 1) socket.send(JSON.stringify({ type: 'set_voltage', volts })) }

function buildGrid(g) {
  grid = g; svg.replaceChildren(); svg.setAttribute('viewBox', `-0.6 -0.6 ${g.cols + 0.2} ${g.rows + 0.2}`)
  el('g', { id: 'pieces' }, svg)
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) {
    if (c + 1 < g.cols) hit([c, r], [c + 1, r]); if (r + 1 < g.rows) hit([c, r], [c, r + 1]) }
  for (let r = 0; r < g.rows; r++) for (let c = 0; c < g.cols; c++) el('circle', { cx: c, cy: r, r: .06, fill: 'currentColor', opacity: .45, 'pointer-events': 'none' }, svg)
  el('circle', { id: 'tip', r: .16, fill: 'rgba(230,90,150,.7)', visibility: 'hidden', 'pointer-events': 'none' }, svg)
}
function hit(a, b) { el('line', { class: 'seg', x1: a[0], y1: a[1], x2: b[0], y2: b[1] }, svg).onclick = () => post('tool', { tool, a, b }) }
svg.onpointermove = e => { if (!grid || !document.getElementById('finger').checked || Date.now() - lastFinger < 60) return
  lastFinger = Date.now(); const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse())
  const x = p.x / (grid.cols - 1), y = p.y / (grid.rows - 1)
  post('finger', { present: true, x: Math.max(-.2, Math.min(1.2, x)), y: Math.max(-.2, Math.min(1.2, y)) }) }

function draw(s) {
  if (!grid || grid.cols !== s.grid.cols || grid.rows !== s.grid.rows) buildGrid(s.grid)
  const layer = document.getElementById('pieces'); layer.replaceChildren()
  for (const p of s.pieces) {
    const open = p.type === 'switch' && !p.closed
    el('line', { class: `piece ${p.type}${p.shorted ? ' shorted' : ''}`, x1: p.a[0], y1: p.a[1], x2: p.b[0], y2: p.b[1], opacity: open ? .35 : 1 }, layer)
    const mx = (p.a[0] + p.b[0]) / 2, my = (p.a[1] + p.b[1]) / 2, flat = p.a[1] === p.b[1]
    let label = p.type === 'wire' ? '' : p.type
    if (p.type === 'battery') label = `+ at ${p.a}`; if (p.type === 'switch') label = p.closed ? 'closed' : 'open'
    if (p.type === 'bulb') label = `bulb ${Math.round(p.brightness * 100)}%`
    if (label) el('text', { x: mx + (flat ? 0 : .42), y: my + (flat ? -.18 : .06) }, layer).textContent = label
    if (Math.abs(p.current) > .0005) el('text', { x: mx + (flat ? 0 : -.42), y: my + (flat ? .32 : .06), opacity: .7 }, layer).textContent = Math.abs(p.current).toFixed(2) + ' A'
  }
  const tip = document.getElementById('tip'); tip.setAttribute('visibility', s.touch.present ? 'visible' : 'hidden')
  tip.setAttribute('cx', s.touch.x * (s.grid.cols - 1)); tip.setAttribute('cy', s.touch.y * (s.grid.rows - 1))
  document.getElementById('status').textContent = `${s.circuit.status} · ${s.circuit.voltage} V · ${s.circuit.total_current.toFixed(3)} A · ${s.pieces.length} pieces · seq ${s.seq}${s.mat_visible ? '' : ' · mat not visible'}`
  const L = s.lesson
  document.getElementById('lesson').textContent = L.step_count ? `Step ${L.step_index + 1}/${L.step_count} (${L.step_id})${L.step_done ? ' ✓ done' : ''}${L.lesson_done ? ' · lesson done' : ''}: ${L.prompt}` : 'no lesson'
  document.getElementById('touch').textContent = 'touch ' + JSON.stringify(s.touch) + (s.circuit.shorted_path.length ? '\nshorted_path ' + JSON.stringify(s.circuit.shorted_path) : '')
}
function connect() {
  socket = new WebSocket(`ws://${location.host}/ws`)
  socket.onmessage = e => draw(JSON.parse(e.data))
  socket.onclose = () => { document.getElementById('status').textContent = 'disconnected, retrying…'; setTimeout(connect, 1000) }
}
connect()
</script>
</body>
</html>
