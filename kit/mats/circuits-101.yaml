# The printed mat for Circuits 101: a grid of dots between four corner markers.
# `make kit` prints from this file and the camera reads against it.
#
# TODO(kit owner): grid size and dot spacing are still open. These are placeholders.
# A piece spans one gap between neighbouring dots, so dot_pitch_mm is the piece length.
# The grid must fit on A4 landscape between the corner markers:
#   (cols - 1) * dot_pitch_mm <= 231 and (rows - 1) * dot_pitch_mm <= 144.

id: circuits-101
cols: 9
rows: 6
dot_pitch_mm: 28
